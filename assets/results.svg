<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-label="Competition results: 3rd of 850+ teams, FieldScreen AI; Winner, EdgeAgent track, LUMEN; 3rd place, Hodgkin's Razor; 2nd place, On the Line; 2nd place, Raccord; 4th of 368, Poker coordination detector; Finalist, 1 of 5, OrbitE; Finalist, 1 of 6, IP Value Framework; 2nd place, Pro, Python and C++; Honorable mention, Vitrify">
<foreignObject width="880" height="290"><div xmlns="http://www.w3.org/1999/xhtml" class="stage"><style>
*{box-sizing:border-box;margin:0;padding:0}
.stage{width:880px;height:290px;overflow:hidden;position:relative;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;
